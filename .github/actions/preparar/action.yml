name: Preparar Node e pnpm
description: Instala o pnpm (versão do packageManager), o Node do .nvmrc e as dependências, com cache do store do pnpm.

runs:
  using: composite
  steps:
    # sem "version": lê o campo packageManager do package.json
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Instalar dependências
      shell: bash
      run: pnpm install --frozen-lockfile
